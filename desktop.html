<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WiFi Speed Test — desktop previews</title>
    <meta
      name="description"
      content="The WiFi Speed Test desktop app as it appears on Windows, macOS and Linux. All figures are simulated."
    />
    <link rel="icon" href="assets/img/icon.png" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/desktop.css" />
  </head>

  <body>
    <main class="stage stage--desktop">
      <header class="stage__head">
        <div class="stage__toolbar">
          <div>
            <h1 class="stage__title" data-i18n="desktopChooseTitle">Which desktop?</h1>
            <p class="stage__subtitle" data-i18n="desktopSubtitle">Desktop app preview</p>
          </div>

          <div style="display: flex; gap: var(--space-3); align-items: center">
            <nav class="shell-nav" aria-label="Shells">
              <a href="index.html">Home</a>
              <a href="terminal.html">Terminal</a>
              <a href="desktop.html" aria-current="page">Desktop</a>
              <a href="mobile.html">Android</a>
              <a href="about.html">About</a>
            </nav>

            <div class="lang-toggle" role="group" data-i18n-label="langLabel">
              <button type="button" data-lang="en" aria-pressed="true">EN</button>
              <button type="button" data-lang="zh-TW" aria-pressed="false">中文</button>
            </div>
          </div>
        </div>

        <p class="section__lead" data-i18n="desktopChooseBody"></p>
      </header>

      <div class="os-grid">
        <!-- Each card previews the frame the page behind it shows, so the
             choice is visible rather than only described. -->
        <a class="os-card os-card--windows" href="desktop-windows.html">
          <span class="os-card__frame" aria-hidden="true">
            <span class="bar">
              <span class="dot"></span>
              <span class="spacer"></span>
              <span class="sq"></span><span class="sq"></span><span class="sq"></span>
            </span>
          </span>
          <span class="os-card__name" data-i18n="osWindows">Windows</span>
          <span class="os-card__note" data-i18n="osWindowsNote"></span>
        </a>

        <a class="os-card os-card--macos" href="desktop-macos.html">
          <span class="os-card__frame" aria-hidden="true">
            <span class="bar">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </span>
          </span>
          <span class="os-card__name" data-i18n="osMacos">macOS</span>
          <span class="os-card__note" data-i18n="osMacosNote"></span>
        </a>

        <a class="os-card os-card--linux" href="desktop-linux.html">
          <span class="os-card__frame" aria-hidden="true">
            <span class="bar">
              <span class="spacer"></span>
              <span class="pill"></span>
              <span class="dot"></span>
            </span>
          </span>
          <span class="os-card__name" data-i18n="osLinux">Linux</span>
          <span class="os-card__note" data-i18n="osLinuxNote"></span>
        </a>
      </div>

      <p class="sim-banner" style="width: min(1040px, 100%)">
        <span class="sim-banner__mark" aria-hidden="true">!</span>
        <span>
          <strong data-i18n="simNotice">Simulated preview.</strong>
          <span data-i18n="simNoticeBody"></span>
        </span>
      </p>
    </main>

    <script src="assets/js/i18n.js"></script>
    <script>
      const active = I18n.init();
      document.querySelectorAll('.lang-toggle button').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === active));
        button.addEventListener('click', () => {
          I18n.set(button.dataset.lang);
          document.querySelectorAll('.lang-toggle button').forEach((other) => {
            other.setAttribute('aria-pressed', String(other === button));
          });
        });
      });
    </script>
  </body>
</html>
